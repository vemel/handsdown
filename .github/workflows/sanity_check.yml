name: Sanity check

on:
  workflow_dispatch: {}

jobs:
  sanity:
    name: Sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install dependencies
        run: |
          poetry install -n
      - name: Parser sanity check
        run: |
          poetry run handsdown -i examples -o docs_examples -d --exclude 'py2.py' --panic
